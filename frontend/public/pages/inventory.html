<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestion du stock</title>
</head>
<body>
    
    <div class="top-controls">
      <!-- Barre de recherche -->
      <div class="search-wrapper">
        <label for="lookup_item_name">Rechercher :</label>
        <input type="text" id="lookup_item_name" name="lookup_item_name" />
      </div>

      <!-- Pagination -->
      <div class="pagination-controls">
        <button id="prev-page-btn">◀️</button>

        <div class="pagination-range">
          <span id="pagination-min">0</span>
          &nbsp;–&nbsp;
          <span id="pagination-max">0</span>
        </div>

        <button id="next-page-btn">▶️</button>
      </div>
    </div>

    
    <!-- Bouton d'ajout -->
    <div class="add-btn-wrapper">
        <button id="add-reservable-btn" class="add-reservable-btn">+</button>
    </div>
    
    
  <!-- Tableau de stock -->
  <div class="table-wrapper">
    <table id="stock_table">
        <thead>
          <tr>
            <th class="sortable" data-field="name" data-label="Nom">Nom</th>
            <th class="preview" data-field="preview">Aperçu</th>
            <th class="sortable" data-field="size" data-label="Taille">Taille</th>
            <th class="sortable" data-field="description" data-label="Description">Description</th>
            <th class="sortable" data-field="gender" data-label="Genre">Genre</th>
            <th class="sortable" data-field="price_per_day" data-label="Prix / jour">Prix / jour</th>
            <th class="sortable" data-field="status" data-label="Statut">Statut</th>
            <th class="sortable" data-field="quality" data-label="Qualité">Qualité</th>
            <th class="sortable" data-field="category" data-label="Catégorie">Catégorie</th>
            <th class="sortable" data-label="Sous-catégorie">Sous-catégorie</th>
            <th class="sortable" data-field="styles" data-label="Styles">Styles</th>
            <th>Editer</th>
            <th>Photos</th>
            <th>Supprimer</th>
          </tr>
        </thead>

      <tbody>
        <!-- lignes dynamiques ici -->
      </tbody>
    </table>
    <!-- Spinner overlay uniquement sur le tableau -->
    <div id="table-spinner" style="display:none;">
      <div style="text-align:center">
        <div class="loader"></div>
        <div style="margin-top:8px;color:white;font-weight:bold;">Upload en cours…</div>
      </div>
    </div>
  </div>
</body>
</html>
